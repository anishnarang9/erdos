[package]
name = "ubc26-proof-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
exclude = ["guest"]

[dependencies]
anyhow = "1"
hex = "0.4"
risc0-ethereum-contracts = { version = "=3.1.0", default-features = false }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client", "disable-dev-mode"] }
serde_json = "1"

[build-dependencies]
risc0-build = "=3.0.7"

[package.metadata.risc0]
methods = ["guest"]
