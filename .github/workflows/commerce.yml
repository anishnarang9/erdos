name: commerce

on:
  push:
    paths: ["commerce/**", ".github/workflows/commerce.yml"]
  pull_request:
    paths: ["commerce/**", ".github/workflows/commerce.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
